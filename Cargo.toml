[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/novamail-ai",
  "crates/novamail-contacts",
  "crates/novamail-core",
  "crates/novamail-crypto",
  "crates/novamail-db",
  "crates/novamail-ipc",
  "crates/novamail-mail",
  "crates/novamail-plugins",
  "crates/novamail-rules",
  "crates/novamail-search",
]
default-members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.20"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/AniGerm/NovaMail"
authors = ["NovaMail Contributors"]

[workspace.dependencies]
novamail-ai = { path = "crates/novamail-ai" }
novamail-contacts = { path = "crates/novamail-contacts" }
novamail-core = { path = "crates/novamail-core" }
novamail-crypto = { path = "crates/novamail-crypto" }
novamail-db = { path = "crates/novamail-db" }
novamail-ipc = { path = "crates/novamail-ipc" }
novamail-mail = { path = "crates/novamail-mail" }
novamail-plugins = { path = "crates/novamail-plugins" }
novamail-rules = { path = "crates/novamail-rules" }
novamail-search = { path = "crates/novamail-search" }

aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.9"
oauth2 = "5"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webpki-roots = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
url = "2"
sha2 = "0.10"
hex = "0.4"
ammonia = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sequoia-openpgp = "2.4"
