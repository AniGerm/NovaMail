[package]
name = "novamail-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaMail desktop shell (Tauri 2)"

[lib]
name = "novamail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
novamail-core = { workspace = true }
novamail-ipc = { workspace = true }
novamail-mail = { workspace = true }
dirs = { workspace = true }
open = "5"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Match wry's WebKitGTK bindings so we can enable native spellcheck on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
